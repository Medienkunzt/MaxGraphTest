# Project MCP servers for Codex on Windows.
# Keep them opt-in: each enabled server adds tool definitions and startup work to
# every task. Enable only for a task that needs that server, for example:
#   codex -c 'mcp_servers.context7.enabled=true' "..."
mcp_optional_startup_grace_ms = 250

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled = true

[mcp_servers.vuetify]
url = "https://mcp.vuetifyjs.com/mcp"
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled = true

[mcp_servers.playwright]
command = "cmd"
args = ["/d", "/c", "npx", "-y", "@playwright/mcp@0.0.80", "--browser", "msedge", "--headless", "--isolated", "--caps", "vision", "--output-dir", ".playwright-mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 60
enabled = false

# Onshape comes from the user-level configuration but is not used by this
# repository. This project-only override leaves the global setting untouched.
[mcp_servers.onshape]
enabled = false
